services:
  - type: web
    name: bbm-app
    runtime: python
    plan: free
    branch: main
    buildCommand: pip install -r requirements.txt
    startCommand: uvicorn app:app --host 0.0.0.0 --port $PORT
    envVars:
      - key: PYTHON_VERSION
        value: "3.11.0"
      - key: BBM_DB
        value: /opt/render/project/src/bbm.db
      - key: BBM_SEED
        value: "1"
      - key: BBM_HAPUS_BEBAS
        value: "0"
